plugins {
    id 'com.github.johnrengelman.shadow'
}

sourceSets {
    main {
        resources.srcDir file("src/generated/resources")
    }
}

loom {
    accessWidenerPath = project(':common').file("src/main/resources/swm.accessWidener")

    forge {
        mixinConfig "swm.mixins.json"
    }
}

architectury {
    platformSetupLoomIde()
    forge()
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common

    shadowBundle {
        canBeResolved = true
        canBeConsumed = false
    }
}

dependencies {
    forge "net.minecraftforge:forge:$project.forge_version"

    modImplementation "dev.architectury:architectury-forge:$project.architectury_api_version"
    modImplementation "dev.kosmx.player-anim:player-animation-lib-forge:${project.player_anim}"

    compileOnly "mezz.jei:jei-${project.minecraft_version}-forge-api:${project.jei_version}"

    common(project(path: ':common', configuration: 'namedElements')) { transitive false }
    shadowBundle project(path: ':common', configuration: 'transformProductionForge')

    implementation "com.electronwill.night-config:toml:3.8.2"
}

processResources {
    inputs.property 'version', project.version

    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

shadowJar {
    configurations = [project.configurations.shadowBundle]
    archiveClassifier = 'dev-shadow'
}

remapJar {
    input.set shadowJar.archiveFile
}
